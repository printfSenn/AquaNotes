<title>AquaNotes</title>
<style>
:root { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #0a3a4a; overflow: hidden; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
.rim { position: fixed; inset: 0; pointer-events: none; border: 10px solid #d3dcdd;
  box-shadow: inset 0 0 0 2px rgba(50,70,80,.55), inset 0 0 70px 6px rgba(0,25,45,.35); }
.hint { position: fixed; left: 0; right: 0; bottom: 0; text-align: center;
  padding: 0 16px calc(28px + env(safe-area-inset-bottom, 0px));
  font: 500 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  color: rgba(255,255,255,.85); letter-spacing: .04em;
  text-shadow: 0 1px 6px rgba(0,40,60,.8); pointer-events: none; transition: opacity 1.2s; }
.hint.gone { opacity: 0; }
.site-footer { position: fixed; right: 26px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 4;
  color: rgba(255,255,255,.72); font: 500 11px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  letter-spacing: .08em; text-transform: uppercase; text-shadow: 0 1px 6px rgba(0,40,60,.75); pointer-events: none; }
@media (max-width: 640px) { .site-footer { right: 14px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); font-size: 10px; } }
</style>
<style>
.app { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(760px, 94vw); height: min(480px, 68vh);
  display: flex; border-radius: 20px; overflow: hidden; background: rgba(5,30,46,.55); border: 1px solid rgba(255,255,255,.18);
  box-shadow: 0 14px 50px rgba(0,20,40,.4); color: #fff; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
.side { width: 280px; flex: none; display: flex; flex-direction: column; border-right: 1px solid rgba(255,255,255,.14); background: rgba(0,20,34,.25); }
.sh { display: flex; gap: 8px; padding: 12px; align-items: center; }
.sh input { flex: 1; min-width: 0; }
.app input, .app textarea { font: inherit; color: #fff; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.2); border-radius: 10px; padding: 8px 10px; outline: none; }
.app input::placeholder, .app textarea::placeholder { color: rgba(255,255,255,.5); }
.app input:focus, .app textarea:focus { border-color: rgba(255,255,255,.65); }
.app button { font: inherit; font-size: 13px; color: #fff; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.25); border-radius: 999px; padding: 7px 14px; cursor: pointer; }
.app button:hover { background: rgba(255,255,255,.2); }
.app .pri, .app .chips button.on { background: #fff; color: #06324a; font-weight: 600; border-color: transparent; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 12px 8px; }
.chips button { padding: 3px 10px; font-size: 12px; }
.list { flex: 1; overflow: auto; padding: 0 8px 8px; }
.item { padding: 9px 10px; border-radius: 10px; cursor: pointer; margin-bottom: 2px; }
.item:hover { background: rgba(255,255,255,.08); }
.item.sel { background: rgba(255,255,255,.18); }
.it { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.is { font-size: 12px; opacity: .7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 12px; gap: 8px; }
.tb { display: flex; gap: 8px; justify-content: flex-end; }
.main textarea { flex: 1; resize: none; line-height: 1.55; font-size: 15px; }
.ft { display: flex; justify-content: space-between; font-size: 12px; opacity: .7; }
.app.off { display: none; }
.tog { position: fixed; top: calc(26px + env(safe-area-inset-top, 0px)); right: 26px; z-index: 5; font: 500 13px system-ui, -apple-system, "Segoe UI", sans-serif;
  color: #fff; background: rgba(5,30,46,.55); border: 1px solid rgba(255,255,255,.3); border-radius: 999px; padding: 8px 14px; cursor: pointer; }
.none { opacity: .7; text-align: center; padding: 18px 8px; }
@media (max-width: 640px) { .app { flex-direction: column; height: 70vh; }
  .side { width: auto; height: 42%; border-right: 0; border-bottom: 1px solid rgba(255,255,255,.14); } }
.sbar { display: flex; justify-content: space-between; align-items: center; padding: 0 14px 6px; font-size: 12px; opacity: .9; }
.app select { font: inherit; font-size: 12px; color: #fff; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.25); border-radius: 8px; padding: 3px 6px; }
.app select option { color: #06324a; }
.sfoot { display: flex; gap: 8px; padding: 8px 12px; border-top: 1px solid rgba(255,255,255,.12); }
.sfoot button { padding: 4px 12px; font-size: 12px; }
.impbox { border-top: 1px solid rgba(255,255,255,.12); }
.impbox textarea { width: calc(100% - 24px); margin: 8px 12px 0; height: 80px; font-size: 12px; box-sizing: border-box; resize: none; }
.impbox .sfoot { border-top: 0; }
.pv { flex: 1; overflow: auto; padding: 10px 12px; border: 1px solid rgba(255,255,255,.2); border-radius: 10px; background: rgba(255,255,255,.06); font-size: 15px; line-height: 1.55; }
.pv[hidden], .impbox[hidden], .toast[hidden] { display: none; }
.pv .h1 { font-size: 22px; font-weight: 700; margin: 4px 0; } .pv .h2 { font-size: 18px; font-weight: 700; } .pv .h3 { font-size: 16px; font-weight: 600; }
.pv .gap { height: 8px; } .pv .chk { display: flex; gap: 8px; align-items: flex-start; } .pv .chk input { margin-top: 5px; }
.pv .done { text-decoration: line-through; opacity: .6; }
.pv a { color: #9fe0ff; } .pv code { background: rgba(255,255,255,.15); padding: 1px 5px; border-radius: 5px; font-size: 13px; }
.toast { position: fixed; left: 50%; bottom: calc(60px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 6; background: rgba(5,30,46,.9);
  color: #fff; border: 1px solid rgba(255,255,255,.25); border-radius: 999px; padding: 8px 8px 8px 16px; font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; white-space: nowrap; }
.toast button { margin-left: 6px; font: inherit; color: #06324a; background: #fff; border: 0; border-radius: 999px; padding: 4px 12px; cursor: pointer; font-weight: 600; }
.sbar { gap: 6px; }
.sbar select { flex: 1; min-width: 0; }
#cnt2 { white-space: nowrap; }
.sw { display: flex; align-items: center; gap: 6px; padding: 0 12px 8px; font-size: 12px; flex-wrap: wrap; }
.sw[hidden], .setbox[hidden], .bar[hidden] { display: none; }
.app .swb { width: 18px; height: 18px; padding: 0; border-radius: 50%; border: 2px solid transparent; }
.app .swb.sel { border-color: #fff; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-left: 6px; vertical-align: middle; }
.setbox { display: grid; gap: 8px; padding: 10px 12px; border-top: 1px solid rgba(255,255,255,.12); font-size: 12px; }
.setbox label { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.setbox select { flex: 1; max-width: 62%; }
.syncbox { display: grid; gap: 6px; padding: 7px 0; border-top: 1px solid rgba(255,255,255,.1); }
.sync-title { font-weight: 600; }
.syncbox input { width: 100%; box-sizing: border-box; font-size: 12px; padding: 6px 8px; }
.sync-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.sync-actions button { padding: 4px 9px; font-size: 11px; }
.syncmsg { min-height: 15px; font-size: 11px; opacity: .78; } .syncmsg.bad { color: #ff9b9b; }
.app .setbox input[type=range] { flex: 1; padding: 0; border: 0; background: transparent; }
.tb { flex-wrap: wrap; }
.app .tb button { padding: 6px 11px; }
.row { display: flex; gap: 8px; }
.row input { min-width: 0; }
#tags { flex: 1; } #folder { width: 112px; } #goal { width: 74px; }
.bar { height: 6px; border-radius: 99px; background: rgba(255,255,255,.15); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: #4dabf7; transition: width .3s; }
.bar i.ok { background: #51cf66; }
.main textarea, .pv { font-size: var(--fs, 15px); }
.app.focus { left: 14px; top: 14px; right: 14px; bottom: 14px; width: auto; height: auto; transform: none; border-radius: 16px; background: rgba(5,30,46,.84); }
.app.focus .side { display: none; }
.app.focus .main { max-width: 860px; margin: 0 auto; width: 100%; padding: 18px; }

<script>
/* Water: height-field wave simulation rendered to a canvas (ripples, refraction, caustics).
   Exposes WN.water = { disturb(x, y, radius, amount), sample(x, y), onStep(fn), canvas, GW, GH, CELL, frozen }. */
(function () {
  var cvs = document.getElementById('c'), ctx = cvs.getContext('2d');
  var buf = document.createElement('canvas'), bctx = buf.getContext('2d');
  var CELL, GW, GH, CW, CH, cur, prev, bg, cau, img, dpr, forced = 0;
  var drops = [], foam = [], T = 0, DAMP = 0.9925, frozen = false;
  var NW = 4, ANG = [0.4, 2.1, -0.9, 3.5], LAM = [90, 55, 140, 38], SPD = [1.6, 2.3, 1.1, 3.0], AMP = [0.8, 0.6, 1.0, 0.35];
  var KX = [], KY = [], UX = [], UY = [], cA, sA, rcB = [], rsB = [], colIn;
  var DEP = 3.5;
  // light: sun direction and half vector (view straight down)
  var LX = -0.35, LY = -0.45, LZ = 0.82, ll = Math.sqrt(LX*LX + LY*LY + LZ*LZ);
  LX /= ll; LY /= ll; LZ /= ll;
  var HX = LX, HY = LY, HZ = LZ + 1, hl = Math.sqrt(HX*HX + HY*HY + HZ*HZ);
  HX /= hl; HY /= hl; HZ /= hl;

  function hash(a, b) {
    var h = (a * 374761393 + b * 668265263) | 0;
    h = (h ^ (h >> 13)) * 1274126177 | 0;
    return ((h ^ (h >> 16)) >>> 0) / 4294967295;
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = Math.max(window.innerWidth || 0, 320), h = Math.max(window.innerHeight || 0, 240);
    cvs.width = Math.round(w * dpr); cvs.height = Math.round(h * dpr);
    CELL = forced || Math.max(3, Math.ceil(Math.sqrt(w * h / 170000)));
    GW = Math.ceil(w / CELL); GH = Math.ceil(h / CELL);
    CW = (GW >> 1) + 1; CH = (GH >> 1) + 1;
    cur = new Float32Array(GW * GH); prev = new Float32Array(GW * GH);
    cau = new Float32Array(CW * CH); colIn = new Float32Array(CW);
    buf.width = GW; buf.height = GH;
    img = bctx.createImageData(GW, GH);
    cA = new Float32Array(NW * GW); sA = new Float32Array(NW * GW);
    for (var k = 0; k < NW; k++) {
      var kk = 2 * Math.PI * CELL / LAM[k];
      UX[k] = Math.cos(ANG[k]) * AMP[k]; UY[k] = Math.sin(ANG[k]) * AMP[k];
      KX[k] = kk * Math.cos(ANG[k]); KY[k] = kk * Math.sin(ANG[k]);
      for (var x = 0; x < GW; x++) { cA[k*GW + x] = Math.cos(KX[k] * x); sA[k*GW + x] = Math.sin(KX[k] * x); }
    }
    buildFloor();
  }

  function blurFloor() {
    var w = GW, h = GH, tmp = new Uint8ClampedArray(bg.length), x, y, c;
    for (var pass = 0; pass < 2; pass++) {
      for (y = 0; y < h; y++) for (x = 0; x < w; x++) {
        var xm = x > 0 ? x - 1 : x, xp = x < w - 1 ? x + 1 : x;
        for (c = 0; c < 3; c++) tmp[(y * w + x) * 3 + c] = (bg[(y * w + xm) * 3 + c] + bg[(y * w + x) * 3 + c] + bg[(y * w + xp) * 3 + c]) / 3;
      }
      for (y = 0; y < h; y++) for (x = 0; x < w; x++) {
        var ym = y > 0 ? y - 1 : y, yp = y < h - 1 ? y + 1 : y;
        for (c = 0; c < 3; c++) bg[(y * w + x) * 3 + c] = (tmp[(ym * w + x) * 3 + c] + tmp[(y * w + x) * 3 + c] + tmp[(yp * w + x) * 3 + c]) / 3;
      }
    }
  }
  function buildFloor() { buildFloor0(); blurFloor(); }
  function buildFloor0() {
    bg = new Uint8ClampedArray(GW * GH * 3);
    var Tl = Math.max(8, Math.round(70 / CELL));
    for (var y = 0; y < GH; y++) for (var x = 0; x < GW; x++) {
      var tx = Math.floor(x / Tl), ty = Math.floor(y / Tl), gx = x % Tl, gy = y % Tl;
      var n = hash(tx, ty), n2 = hash(x >> 1, y >> 1);
      var depth = 1 - 0.28 * (y / GH) - 0.18 * Math.abs(x / GW - 0.5);
      var r, g, b;
      if (gx < 1 || gy < 1) { r = 110; g = 165; b = 180; }
      else {
        var e = Math.min(gx, gy, Tl - gx, Tl - gy), bev = e < 3 ? 0.9 + e * 0.035 : 1;
        var gr = 0.97 + n2 * 0.06;
        r = (40 + n * 16) * bev * gr; g = (160 + n * 20) * bev * gr; b = (180 + n * 14) * bev * gr;
      }
      if (Math.abs(x - GW * 0.25) < 2.5 || Math.abs(x - GW * 0.75) < 2.5 || Math.abs(y - GH * 0.5) < 2.5) { r = 25; g = 70; b = 120; }
      var i = (y * GW + x) * 3;
      bg[i] = r * depth; bg[i+1] = g * depth; bg[i+2] = b * depth;
    }
  }

  function disturb(cx, cy, rad, amt) {
    var x0 = Math.max(1, Math.floor(cx - rad)), x1 = Math.min(GW - 2, Math.ceil(cx + rad));
    var y0 = Math.max(1, Math.floor(cy - rad)), y1 = Math.min(GH - 2, Math.ceil(cy + rad));
    for (var y = y0; y <= y1; y++) for (var x = x0; x <= x1; x++) {
      var d = Math.sqrt((x - cx) * (x - cx) + (y - cy) * (y - cy));
      if (d < rad) cur[y * GW + x] -= amt * 0.5 * (1 + Math.cos(Math.PI * d / rad));
    }
  }

  function step() {
    var w = GW;
    for (var y = 1; y < GH - 1; y++) {
      var i = y * w + 1;
      for (var x = 1; x < w - 1; x++, i++)
        prev[i] = ((cur[i-1] + cur[i+1] + cur[i-w] + cur[i+w]) * 0.5 - prev[i]) * DAMP;
    }
    var t = cur; cur = prev; prev = t;
  }

  function caustics() {
    for (var cx = 0; cx < CW; cx++) colIn[cx] = Math.sin(cx * 2 * 0.06 - T * 0.5) * 1.7;
    for (var cy = 0; cy < CH; cy++) {
      var y = cy * 2, rin = Math.sin(y * 0.07 + T * 0.6) * 1.7, a2 = y * 0.1 - T * 0.7;
      for (var cx2 = 0; cx2 < CW; cx2++) {
        var x = cx2 * 2;
        var l1 = 1 - Math.abs(Math.sin(x * 0.09 + T * 0.9 + rin)); l1 *= l1; l1 *= l1;
        var l2 = 1 - Math.abs(Math.sin(a2 + colIn[cx2])); l2 *= l2; l2 *= l2;
